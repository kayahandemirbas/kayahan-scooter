<style>
/* Tasarım: gece sürüşü — derin lacivert zemin, scooter sarısı vurgu, harita tam ekran, cam efektli kartlar */
:root{
  --bg:#F2F4F8;--surface:rgba(255,255,255,.94);--solid:#FFFFFF;--ink:#0E1622;--muted:#5E6B7D;--line:rgba(14,22,34,.10);
  --accent:#FFB000;--accent-2:#FF7A00;--accent-ink:#1A1000;--ok:#14A865;--warn:#E08A00;--bad:#E5484D;--blue:#2F7BEA;
  --shadow:0 10px 30px rgba(14,22,34,.16),0 2px 6px rgba(14,22,34,.08);
  --f-d:"Bricolage Grotesque",system-ui,sans-serif;--f-b:"Figtree",system-ui,sans-serif;--f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A111B;--surface:rgba(18,28,42,.92);--solid:#121C2A;--ink:#EEF2F7;--muted:#93A1B4;--line:rgba(238,242,247,.10);
  --ok:#2FD08A;--warn:#FFB020;--bad:#FF6B6E;--blue:#6BA6FF;--shadow:0 12px 34px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
h1{font:800 30px/1.08 var(--f-d);letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font:800 19px/1.2 var(--f-d);letter-spacing:-.01em;margin:0}
.btn{appearance:none;border:0;border-radius:16px;padding:15px 18px;font:700 16px var(--f-b);cursor:pointer;background:linear-gradient(180deg,var(--accent),var(--accent-2));color:var(--accent-ink);width:100%;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;box-shadow:0 6px 18px rgba(255,140,0,.32);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.dark{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#FF5A5F,#D63A3F);color:#fff;box-shadow:0 6px 18px rgba(229,72,77,.3)}
.btn.sm{padding:9px 13px;font-size:13px;width:auto;border-radius:12px;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn svg{width:20px;height:20px;flex:none}
.btn:focus-visible,input:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{font-size:12px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap;letter-spacing:.01em}
.c-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.c-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.c-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.c-off{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.c-blue{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:14px;padding:10px 12px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.kv b{font:700 18px var(--f-m)}
.alert{border-radius:14px;padding:11px 13px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.alert.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.alert::before{content:"!";flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--f-b);background:var(--warn);color:#fff}
.alert.bad::before{background:var(--bad)}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 11px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn.on{color:var(--ok)}.conn.on::before{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:live 1.8s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:3000;max-width:92vw;text-align:center;box-shadow:var(--shadow);animation:drop .25s ease-out}
@keyframes drop{from{opacity:0;transform:translate(-50%,-10px)}}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.iconbtn svg{width:20px;height:20px}
.logo{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 12px rgba(255,140,0,.35)}
.brand{display:flex;align-items:center;gap:10px;font:800 20px var(--f-d);letter-spacing:-.02em}

/* ---- Karşılama ---- */
.welcome{min-height:100%;padding:calc(18px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hero{border-radius:28px;padding:22px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#FF9A1F 0%,#FF6A00 30%,transparent 60%),linear-gradient(160deg,#141F2E,#0A111B);position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.hero h1{color:#fff;font-size:32px}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:14px;max-width:30ch}
.hero svg.sc{position:absolute;right:-14px;top:-8px;width:130px;height:130px;opacity:.35}
.roles{display:grid;gap:10px}
.role{appearance:none;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--solid);border:1px solid var(--line);border-radius:20px;padding:15px;cursor:pointer;box-shadow:0 2px 10px rgba(14,22,34,.05);transition:transform .12s}
.role:active{transform:scale(.985)}
.role b{display:block;font:800 17px var(--f-d)}.role span{color:var(--muted);font-size:13px;font-weight:500}
.role i{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-style:normal}
.role i svg{width:26px;height:26px}
.role em{font-style:normal;color:var(--muted);font-size:22px}
.field{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number]{font:600 16px var(--f-b);padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--ink);width:100%}

/* ---- Harita ekranı (müşteri) ---- */
.mapscreen{position:fixed;inset:0}
.mapscreen .map{position:absolute;inset:0;z-index:0}
.topbar{position:absolute;z-index:500;top:calc(10px + env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.topbar>*{pointer-events:auto}
.pillbrand{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 12px 6px 6px;box-shadow:var(--shadow);font:800 16px var(--f-d);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pillbrand img{width:30px;height:30px;border-radius:9px}
.fab{position:absolute;z-index:500;right:max(12px,env(safe-area-inset-right))}

function hav(a,b,c,d){const R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=p2-p1,dl=(d-b)*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

/* ===== ses / titreşim / ekran ===== */
let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(fs){if(!actx)return;let t=actx.currentTime;fs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.24);t+=.24})}
function say(text){try{if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.ksSay){webkit.messageHandlers.ksSay.postMessage(text);return}const u=new SpeechSynthesisUtterance(text);u.lang="tr-TR";const vs=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang));const v=vs.find(v=>/siri/i.test(v.name))||vs.find(v=>/enhanced|premium|geliştirilmiş/i.test(v.name))||vs[0];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function keepAwake(){try{if("wakeLock" in navigator)await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&role&&role!=="panel")keepAwake()});

/* ===== konum / batarya ===== */
let pos=null,geoErr="",bat=null;
function startGeo(){
  if(window.__ksNative)return;
  if(!navigator.geolocation){geoErr="Bu cihazda konum yok.";return}
  navigator.geolocation.watchPosition(p=>{pos={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),speed:p.coords.speed==null?null:Math.round(p.coords.speed*3.6)};geoErr=""},
    e=>{geoErr=e.code===1?"Konum izni verilmedi. Ayarlar'dan tarayıcıya konum izni ver.":"Konum alınamıyor, açık alana çık."},
    {enableHighAccuracy:true,maximumAge:1500,timeout:20000});
}
try{navigator.getBattery&&navigator.getBattery().then(b=>{bat=Math.round(b.level*100);b.addEventListener("levelchange",()=>bat=Math.round(b.level*100))}).catch(()=>{})}catch(e){}
window.ksNative=function(d){ /* Toolkit uygulamasından gelen yerel konum/batarya */
  if(d&&typeof d.lat==="number")pos={lat:+d.lat.toFixed(6),lng:+d.lng.toFixed(6),acc:Math.round(d.acc||10),speed:d.speed==null?null:Math.round(d.speed)};
  if(d&&typeof d.bat==="number")bat=Math.round(d.bat);
  if(d&&typeof d.lat==="number")geoErr="";
};
window.ksNativeErr=m=>{geoErr=m;toast(m,6000)};
const IN_APP=!!window.__ksNative||!/^https?:/.test(location.protocol);
function publicUrl(){const h=location.href.split("#")[0];if(location.protocol==="https:")return h;return liveUrl||ls.get("ks_public")||(PUBLIC_URL.startsWith("http")?PUBLIC_URL:"")}
let liveUrl="";
function parseCode(t){t=String(t||"").trim();const m=t.match(/[#&?]u=([A-Za-z0-9-]+)/);if(m)return m[1].toUpperCase();if(/^KS:/i.test(t))return t.slice(3).toUpperCase();return t.toUpperCase()}
const QR_U=(location.hash.match(/[#&]u=([A-Za-z0-9-]+)/)||[])[1];

/* ===== canlı bağlantı ===== */
let client=null,connected=false,myTopic=null,myState=null;
const devices=new Map();
let zones=[],price={open:10,min:4};
const handlers=new Set(),cmdHandlers=new Set(),rideHandlers=new Set(),urlHandlers=new Set();
const T=s=>ROOM+"/"+s;
function connect(id){
  if(!window.mqtt)return;
  myTopic=T("d/"+id);
  let bi=0,failed=0;
  const make=()=>mqtt.connect(BROKERS[bi],{clientId:"ks_"+id+"_"+Math.random().toString(16).slice(2,8),clean:true,keepalive:20,reconnectPeriod:3000,connectTimeout:8000,will:{topic:myTopic,payload:"",qos:1,retain:true}});
  const wire=c=>{
    c.on("connect",()=>{connected=true;failed=0;c.subscribe([T("d/+"),T("zones"),T("price"),T("cmd"),T("rides"),T("url")],{qos:1});if(/^https:/.test(location.protocol)){const u=location.href.split("#")[0];if(u!==liveUrl)c.publish(T("url"),JSON.stringify({u}),{qos:1,retain:true})}if(myState)publishMe();fire()});
    c.on("close",()=>{connected=false;fire()});
    c.on("error",()=>{});
    c.on("offline",()=>{failed++;connected=false;fire();if(failed>=2&&BROKERS.length>1){failed=0;bi=(bi+1)%BROKERS.length;try{c.end(true)}catch(e){}client=make();wire(client)}});
    c.on("message",(topic,buf)=>{
      const txt=buf.toString();let d=null;try{d=txt?JSON.parse(txt):null}catch(e){return}
      const sub=topic.slice(ROOM.length+1);
      if(sub.startsWith("d/")){const did=sub.slice(2);if(!d)devices.delete(did);else devices.set(did,d)}
      else if(sub==="zones")zones=Array.isArray(d)?d:[];
      else if(sub==="price"&&d&&typeof d.open==="number")price=d;
      else if(sub==="cmd"&&d)cmdHandlers.forEach(f=>f(d));
      else if(sub==="rides"&&d)rideHandlers.forEach(f=>f(d));
      else if(sub==="url"&&d&&typeof d.u==="string"&&/^https:\/\//.test(d.u)&&d.u!==liveUrl){liveUrl=d.u;urlHandlers.forEach(f=>f())}
      fire();
    });
  };
  client=make();wire(client);
}
function fire(){handlers.forEach(f=>{try{f()}catch(e){console.error(e)}})}
function publish(sub,obj,retain){if(client&&connected)client.publish(T(sub),obj==null?"":JSON.stringify(obj),{qos:1,retain:!!retain})}
function publishMe(){if(!myState)return;myState.ts=Date.now();if(client&&connected)client.publish(myTopic,JSON.stringify(myState),{qos:0,retain:true})}
function setMe(patch){myState=Object.assign(myState||{},patch);publishMe()}
setInterval(publishMe,3000);
window.addEventListener("pagehide",()=>{try{client&&myTopic&&client.publish(myTopic,"",{qos:0,retain:true})}catch(e){}});
const online=d=>d&&Math.abs(Date.now()-(d.ts||0))<ONLINE_MS;
const scooters=()=>[...devices.values()].filter(d=>d.role==="scooter"&&online(d));
const customers=()=>[...devices.values()].filter(d=>d.role==="musteri"&&online(d));
function riderOf(sid){const rs=customers().filter(c=>c.ride&&c.ride.sid===sid).sort((a,b)=>a.ride.start-b.ride.start||(a.id<b.id?-1:1));return rs[0]||null}
function zoneOf(lat,lng){if(lat==null)return null;let z=null;for(const Z of zones){if(hav(lat,lng,Z.lat,Z.lng)<=Z.r){if(Z.type==="ban")return "ban";z="slow"}}return z}
const connPill=()=>`<span class="conn ${connected?"on":""}" data-conn>${connected?"Canlı":"Bağlanıyor"}</span>`;
handlers.add(()=>document.querySelectorAll("[data-conn]").forEach(e=>{e.className="conn "+(connected?"on":"");e.textContent=connected?"Canlı":"Bağlanıyor"}));

/* ===== harita ===== */
const dark=()=>matchMedia("(prefers-color-scheme: dark)").matches;
function makeMap(el,forceDark){
  const m=L.map(el,{zoomControl:false,attributionControl:true}).setView([40.7656,29.9408],15);
  const isDark=forceDark||dark(),E="https://server.arcgisonline.com/ArcGIS/rest/services/";
  // Anahtar gerektirmeyen harita (Esri); yüklenmezse OpenStreetMap'e geçer
  const base=isDark?L.tileLayer(E+"Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:16,attribution:"© Esri, OpenStreetMap"})
                   :L.tileLayer(E+"World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,attribution:"© Esri, OpenStreetMap"});
  base.addTo(m);
  if(isDark)L.tileLayer(E+"Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:16}).addTo(m);
  let errs=0,swapped=false;
  base.on("tileerror",()=>{if(swapped||++errs<4)return;swapped=true;m.eachLayer(l=>{if(l instanceof L.TileLayer)m.removeLayer(l)});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m)});
  return m;
}
function pinIcon(d,sel){
  const used=!!riderOf(d.id),ban=used&&zoneOf(d.lat,d.lng)==="ban";
  const fill=used?"#14A865":"#FFB000";
  return L.divIcon({className:"",iconSize:[44,52],iconAnchor:[22,48],html:`<div class="pin ${used?"u":""} ${sel?"sel":""}">${ban?'<span class="ring"></span>':""}<svg viewBox="0 0 44 52"><path d="M22 51c-1.2 0-2-.8-3-2.2L10 36A18 18 0 1 1 34 36l-9 12.8c-1 1.4-1.8 2.2-3 2.2z" fill="${fill}" stroke="#fff" stroke-width="2.5"/><circle cx="22" cy="20" r="12.5" fill="rgba(255,255,255,.28)"/></svg><b>${d.bat??"?"}</b></div>`});
}
const meIcon=()=>L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[20,20],iconAnchor:[10,10]});
const custIcon=()=>L.divIcon({className:"",html:'<div class="cust"></div>',iconSize:[14,14],iconAnchor:[7,7]});
function drawZones(layer,onClick){layer.clearLayers();zones.forEach(z=>{const c=L.circle([z.lat,z.lng],{radius:z.r,color:z.type==="ban"?"#E5484D":"#E08A00",weight:2,dashArray:"7 6",fillOpacity:.16});if(onClick)c.on("click",ev=>{L.DomEvent.stopPropagation(ev);onClick(z)});c.addTo(layer)})}

/* =========================================================
   SCOOTER
   ========================================================= */
function scooterMode(){
  let id=ls.get("ks_sid");if(!id){id="KS-"+rnd();ls.set("ks_sid",id)}
  myState={id,role:"scooter",name:id,bat:bat??100};connect(id);
  app.innerHTML=`<div class="sc-screen">
  <div class="row"><div class="brand"><img class="logo" src="${ICON}" alt="">Scooter</div><div class="tools">${connPill()}<button class="iconbtn" id="sw" aria-label="Rol değiştir">${IC.menu}</button></div></div>
  <div class="lockstage locked" id="st"><div class="lockring"><div class="core" id="lk">${IC.lock}</div></div><div class="s1" id="s1">KİLİTLİ</div><div class="s2" id="s2">Müşteri bekleniyor</div></div>
  <div id="zA"></div>
  <div class="card"><div class="row"><h2 class="mono">${id}</h2><span class="chip c-off" id="peers"></span></div>
    <div class="kv"><div><small>Batarya</small><b id="kB">–</b></div><div><small>GPS</small><b id="kA">–</b></div><div><small>Hız</small><b id="kS">–</b></div></div>
    <div class="kv" id="rk" hidden><div><small>Süre</small><b id="kT"></b></div><div><small>Mesafe</small><b id="kD"></b></div><div><small>Sürücü</small><b id="kR" style="font-size:14px"></b></div></div>
    <p class="note" id="geo"></p></div>
  <div class="card"><div class="row"><h2>Kilit QR kodu</h2><span class="chip c-blue">Okutunca açılır</span></div><div class="qrbox"><div id="qr"></div><div class="qrtag">${id}</div></div><p class="note">Herhangi bir telefon kamerasıyla okutunca uygulama açılır ve kilit açılır. Ekran açık kalmalı, kilitlenirse konum gönderimi durur.</p><a class="btn ghost" id="waLink" target="_blank" rel="noopener" hidden>WhatsApp'tan kilit linki gönder</a></div>
  </div>`;
  $("#sw").onclick=switchRole;
  function drawQr(){const pu=publicUrl();$("#qr").innerHTML="";new QRCode($("#qr"),{text:pu?pu+"#u="+id:"KS:"+id,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});const w=$("#waLink");if(w){w.hidden=!pu;if(pu)w.href="https://wa.me/?text="+encodeURIComponent("Kayahan Scooter "+id+" — dokun, kilidi aç: "+pu+"#u="+id)}}
  drawQr();urlHandlers.add(drawQr);
  startGeo();keepAwake();
  let lastKey=null,lastZone=null,dist=0,prev=null;
  function draw(){
    const r=riderOf(id),un=!!r,key=r?r.id+":"+r.ride.start:null;
    if(key!==lastKey){
      if(un){beep([660,880,1180]);buzz([150,80,150]);say("Kilit açıldı. İyi sürüşler.");dist=0;prev=pos}
      else if(lastKey){beep([880,660]);buzz(300);say("Sürüş bitti. Scooter kilitlendi.")}
      lastKey=key;
    }
    const z=pos?zoneOf(pos.lat,pos.lng):null;
    if(un&&z!==lastZone&&z){if(z==="ban"){beep([420,420,420]);buzz([300,100,300]);say("Dikkat. Sürüş yasak bölgedesin.")}else{beep([720]);buzz(200);say("Yavaş bölge. Hız on beş kilometreye düşürüldü.")}}
    lastZone=z;
    $("#st").className="lockstage "+(un?"unlocked":"locked");$("#lk").innerHTML=un?IC.unlock:IC.lock;
    $("#s1").textContent=un?"KİLİT AÇIK":"KİLİTLİ";$("#s2").textContent=un?"Sürüşte · "+(r.name||"müşteri"):"Müşteri bekleniyor";
    $("#rk").hidden=!un;if(un){$("#kT").textContent=mmss((Date.now()-r.ride.start)/1000);$("#kD").textContent=(dist/1000).toFixed(2)+" km";$("#kR").textContent=r.name||"–"}
    $("#zA").innerHTML=un&&z==="ban"?'<div class="alert bad">Sürüş yasak bölge. Gerçek scooter burada durdurulur.</div>':un&&z==="slow"?'<div class="alert">Yavaş bölge. Gerçek scooterda hız 15 km/s ile sınırlanır.</div>':"";
    $("#kB").textContent="%"+(bat??100);$("#kA").textContent=pos?"±"+pos.acc+"m":"–";$("#kS").textContent=pos&&pos.speed!=null?pos.speed:"–";
    $("#geo").textContent=geoErr||(pos?"Konum canlı gönderiliyor.":"Konum bekleniyor…");
    const n=[...devices.values()].filter(d=>d.id!==id&&online(d)).length;$("#peers").textContent=n+" cihaz bağlı";$("#peers").className="chip "+(n?"c-blue":"c-off");
  }
  setInterval(()=>{if(pos){if(prev&&lastKey){const s=hav(prev.lat,prev.lng,pos.lat,pos.lng);if(s<250&&pos.acc<80)dist+=s}prev=pos}setMe(Object.assign({bat:bat??100},pos||{}))},2000);
  handlers.add(draw);draw();setInterval(draw,1000);
}

function customerMode(){
  let id=ls.get("ks_mid");if(!id){id="M-"+rnd();ls.set("ks_mid",id)}
  const name=ls.get("ks_name")||id;
  let ride=null;try{ride=JSON.parse(ls.get("ks_ride")||"null")}catch(e){}
  myState={id,role:"musteri",name,ride};connect(id);
  let phase=ride?"ride":"browse",sel=null,photo=null,receipt=null,centered=false,follow=true;
  let track=[];try{track=ride?JSON.parse(ls.get("ks_track")||"[]"):[]}catch(e){}
  let dist=+(ls.get("ks_dist")||0);
  app.innerHTML=`<div class="mapscreen"><div id="mapEl" class="map"></div>
  <div class="topbar"><div class="pillbrand"><img src="${ICON}" alt="">Kayahan</div><div class="tools">${connPill()}<button class="iconbtn" id="sw" aria-label="Rol değiştir">${IC.menu}</button></div></div>
  <button class="iconbtn fab" id="locate" aria-label="Konumuma git">${IC.loc}</button>
  <div class="sheet" id="sheet"></div></div>
  <input type="file" id="ph" accept="image/*" capture="environment" hidden>`;
  $("#sw").onclick=switchRole;
  const map=makeMap($("#mapEl")),zl=L.layerGroup().addTo(map),sl=L.layerGroup().addTo(map),trl=L.layerGroup().addTo(map);let meMk=null;
  map.on("dragstart",()=>follow=false);
  $("#locate").onclick=()=>{follow=true;if(pos)map.flyTo([pos.lat,pos.lng],17,{duration:.6});else toast(geoErr||"Konum bekleniyor…")};
  const placeFab=()=>{const h=$("#sheet").offsetHeight;$("#locate").style.bottom=(h+12)+"px"};
  new ResizeObserver(placeFab).observe($("#sheet"));
  startGeo();keepAwake();

  /* QR okuyucu */
  let stream=null,scanning=false;const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  window.ksScanned=code=>unlock(parseCode(code)); // Toolkit'in yerel QR okuyucusu
  async function openScan(){
    if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.ksScan){webkit.messageHandlers.ksScan.postMessage("open");return}
    $("#scan").hidden=false;$("#scanMsg").textContent="Kamera açılıyor…";$("#manual").value="";
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});const v=$("#vid");v.srcObject=stream;await v.play();scanning=true;$("#scanMsg").textContent="Scooter üzerindeki kodu okut";loop()}
    catch(e){$("#scanMsg").textContent="Kamera açılamadı. Kamera iznini kontrol et ya da kodu elle gir."}
  }
  function closeScan(){scanning=false;$("#scan").hidden=true;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
  function loop(){if(!scanning)return;const v=$("#vid");
    if(v.readyState>=2&&v.videoWidth){const w=480,h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
      const code=window.jsQR&&jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"attemptBoth"});
      if(code&&code.data){closeScan();beep([880]);buzz(80);unlock(parseCode(code.data));return}}
    requestAnimationFrame(loop)}
  $("#scanClose").onclick=closeScan;
  $("#manGo").onclick=()=>{const v=$("#manual").value.trim();if(v){closeScan();unlock(parseCode(v))}};

  function unlock(sid){
    sid=String(sid).toUpperCase().trim();
    if(!connected){toast("Canlı bağlantı yok, birkaç saniye sonra tekrar dene.");return}
    const s=devices.get(sid);
    if(!s||s.role!=="scooter"||!online(s)){toast(sid+" çevrimiçi değil. Scooter telefonunda sayfa açık mı?",4500);return}
    const r=riderOf(sid);if(r&&r.id!==id){toast("Bu scooter şu an başka bir sürüşte.",4000);return}
    ride={sid,start:Date.now()};track=s.lat!=null?[[s.lat,s.lng]]:[];dist=0;
    ls.set("ks_ride",JSON.stringify(ride));ls.set("ks_track","[]");ls.set("ks_dist","0");setMe({ride});
    phase="ride";follow=true;toast("Kilit açıldı · İyi sürüşler!");say("Kilit açıldı");draw(true);
  }
  function finish(byPanel){
    const min=Math.max(1,Math.ceil((Date.now()-ride.start)/60000));
    receipt={sid:ride.sid,min,km:(dist/1000).toFixed(2),open:price.open,pmin:price.min,total:price.open+min*price.min,byPanel:!!byPanel};
    publish("rides",Object.assign({rider:name,end:Date.now()},receipt),false);
    ride=null;track=[];ls.del("ks_ride");ls.del("ks_track");ls.del("ks_dist");setMe({ride:null});photo&&URL.revokeObjectURL(photo);photo=null;phase="receipt";say("Sürüş tamamlandı");draw(true);
  }
  cmdHandlers.add(c=>{if(c.type==="lock"&&ride&&c.sid===ride.sid){toast("Scooter yönetim panelinden kilitlendi.",4500);finish(true)}});
  $("#ph").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f){photo&&URL.revokeObjectURL(photo);photo=URL.createObjectURL(f);draw(true)}};

  function draw(force){
    const el=$("#sheet");
    if(phase==="ride"&&ride){
      const s=devices.get(ride.sid),r=riderOf(ride.sid);
      if(connected&&r&&r.id!==id){toast("Bu scooteri senden önce başka biri açtı. Sürüş iptal edildi.",5000);ride=null;ls.del("ks_ride");setMe({ride:null});phase="browse";draw(true);return}
      const sec=(Date.now()-ride.start)/1000,cost=price.open+Math.max(1,Math.ceil(sec/60))*price.min,z=s?zoneOf(s.lat,s.lng):null,on=online(s);
      if(force||!$("#rT")){
        el.innerHTML=`<div class="row"><span class="chip c-ok">● Sürüşte · ${esc(ride.sid)}</span><span class="chip" id="rSig"></span></div>
        <div class="ridehead"><div><div class="note">Süre</div><div class="timer" id="rT"></div></div><div style="text-align:right"><div class="note">Ücret</div><div class="cost" id="rC"></div></div></div>
        <div class="kv"><div><small>Mesafe</small><b id="rD"></b></div><div><small>Bölge</small><b id="rZ" style="font-size:15px"></b></div><div><small>Batarya</small><b id="rB"></b></div></div>
        <div id="rA"></div><button class="btn danger" id="end">${IC.lock}Sürüşü bitir</button>`;
        $("#end").onclick=()=>{phase="park";draw(true)};
      }
      $("#rT").textContent=mmss(sec);$("#rC").textContent=tl(cost);$("#rD").textContent=(dist/1000).toFixed(2)+" km";
      $("#rZ").textContent=z==="ban"?"Yasak":z==="slow"?"Yavaş":"Normal";$("#rB").textContent="%"+(s&&s.bat!=null?s.bat:"?");
      const sg=$("#rSig");sg.textContent=on?"Scooter canlı":"Sinyal yok";sg.className="chip "+(on?"c-blue":"c-warn");
      $("#rA").innerHTML=z==="ban"?'<div class="alert bad">Sürüş yasak bölgedesin. Bu alanda scooter durdurulur.</div>':z==="slow"?'<div class="alert">Yavaş bölgedesin. Hız 15 km/s ile sınırlı.</div>':"";
      return;
    }
    if(!force)return;
    if(phase==="park"){
      el.innerHTML=`<h2>Park fotoğrafı</h2><div class="photo">${photo?`<img src="${photo}" alt="Park fotoğrafı">`:`<span style="width:40px;height:40px;display:block">${IC.cam}</span>Scooterı ve çevresini gösteren bir fotoğraf çek.`}</div>
      <button class="btn ghost" id="shot">${IC.cam}${photo?"Yeniden çek":"Fotoğraf çek"}</button><button class="btn" id="fin" ${photo?"":"disabled"}>${IC.lock}Kilitle ve öde</button><button class="btn ghost" id="back">Sürüşe dön</button>`;
      $("#shot").onclick=()=>$("#ph").click();$("#fin").onclick=()=>finish(false);$("#back").onclick=()=>{phase="ride";draw(true)};return;
    }
    if(phase==="receipt"&&receipt){const r=receipt;
      el.innerHTML=`<div class="check">${IC.check}</div><h2 style="text-align:center">Sürüş tamamlandı</h2>
      <div class="receipt"><div class="it"><span>Scooter</span><span class="mono">${esc(r.sid)}</span></div><div class="it"><span>Süre</span><span class="mono">${r.min} dk</span></div><div class="it"><span>Mesafe</span><span class="mono">${r.km} km</span></div><div class="it"><span>Açılış ücreti</span><span class="mono">${tl(r.open)}</span></div><div class="it"><span>${r.min} dk × ${tl(r.pmin)}</span><span class="mono">${tl(r.min*r.pmin)}</span></div><div class="it tot"><span>Toplam</span><span class="mono">${tl(r.total)}</span></div></div>
      <p class="note" style="text-align:center">Test sürümü: kart çekimi yapılmaz, tutar sadece hesaplanır.</p><button class="btn" id="ok">Tamam</button>`;
      $("#ok").onclick=()=>{phase="browse";receipt=null;draw(true)};return}
    const list=scooters().map(s=>Object.assign({},s,{d:pos&&s.lat!=null?hav(pos.lat,pos.lng,s.lat,s.lng):null})).sort((a,b)=>(a.d??1e9)-(b.d??1e9));
    const s=list.find(d=>d.id===sel);
    if(s){const used=!!riderOf(s.id);
      el.innerHTML=`<div class="row"><div><div class="mono" style="font:800 22px var(--f-m)">${esc(s.id)}</div><div class="note">${s.d!=null?distTxt(s.d)+" uzakta":"Uzaklık bilinmiyor"}</div></div>${used?'<span class="chip c-warn">Kullanımda</span>':'<span class="chip c-ok">Müsait</span>'}</div>
      <div class="kv"><div><small>Batarya</small><b style="color:${battCol(s.bat)}">%${esc(s.bat??"?")}</b></div><div><small>Açılış</small><b>${price.open}₺</b></div><div><small>Dakika</small><b>${price.min}₺</b></div></div>
      <button class="btn" id="qrB" ${used?"disabled":""}>${IC.qr}QR okut ve kilidi aç</button><button class="btn ghost" id="desel">Tüm scooterlar</button>`;
    }else{
      el.innerHTML=`<div class="row"><h2>${list.length?list.length+" scooter yakında":"Yakında scooter yok"}</h2>${connPill()}</div>
      ${list.length?`<div style="display:grid;gap:8px">${list.slice(0,4).map(d=>`<button class="scrow" data-s="${esc(d.id)}"><span class="ico" style="color:var(--accent-2)">${IC.scooter}</span><span><b>${esc(d.id)}</b><small>${d.d!=null?distTxt(d.d)+" uzakta":"konum bekleniyor"}${riderOf(d.id)?" · kullanımda":""}</small></span>${battHtml(d.bat)}</button>`).join("")}</div>`:'<p class="note">Diğer telefonda linki açıp <b>Scooter</b> seçince burada görünür.</p>'}
      <button class="btn" id="qrB">${IC.qr}QR okut</button>`;
      el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sel=b.dataset.s;const d=devices.get(sel);if(d&&d.lat!=null){follow=false;map.flyTo([d.lat,d.lng],17,{duration:.5})}draw(true)});
    }
    $("#qrB").onclick=openScan;$("#desel")&&($("#desel").onclick=()=>{sel=null;draw(true)});
  }
  let lastSig="",pendingU=QR_U&&!ride?QR_U.toUpperCase():null;const pendingT=Date.now();
  if(pendingU)toast(pendingU+" bulunuyor…",2500);
  function update(){
    if(pendingU&&connected){const d=devices.get(pendingU);if(d&&online(d)){const u=pendingU;pendingU=null;history.replaceState(null,"","#musteri");unlock(u)}else if(Date.now()-pendingT>15000){toast(pendingU+" çevrimiçi değil. Scooter telefonunda uygulama açık mı?",5000);pendingU=null;history.replaceState(null,"","#musteri")}}
    drawZones(zl);sl.clearLayers();trl.clearLayers();
    scooters().filter(d=>d.lat!=null).forEach(d=>{const m=L.marker([d.lat,d.lng],{icon:pinIcon(d,d.id===sel||(ride&&ride.sid===d.id))}).addTo(sl);m.on("click",()=>{if(phase==="browse"){sel=d.id;draw(true)}})});
    if(ride){const s=devices.get(ride.sid);if(s&&s.lat!=null){const last=track[track.length-1];if(!last||last[0]!==s.lat||last[1]!==s.lng){if(last){const st=hav(last[0],last[1],s.lat,s.lng);if(st<250&&(s.acc||50)<80)dist+=st}track.push([s.lat,s.lng]);track=track.slice(-600);ls.set("ks_track",JSON.stringify(track));ls.set("ks_dist",String(dist))}
        if(follow)map.panTo([s.lat,s.lng],{animate:true})}
      if(track.length>1){L.polyline(track,{color:"#fff",weight:9,opacity:.9}).addTo(trl);L.polyline(track,{color:"#FF8A00",weight:5}).addTo(trl)}}
    if(pos){if(!meMk)meMk=L.marker([pos.lat,pos.lng],{icon:meIcon(),zIndexOffset:1000}).addTo(map);else meMk.setLatLng([pos.lat,pos.lng]);if(!centered){map.setView([pos.lat,pos.lng],16);centered=true}}
    const sig=JSON.stringify(scooters().map(d=>[d.id,!!riderOf(d.id),d.bat]))+price.open+price.min+connected+(pos?Math.round(pos.lat*2000)+","+Math.round(pos.lng*2000):"");
    if(phase==="browse"&&sig!==lastSig){lastSig=sig;draw(true)}else draw(false);
  }
  setInterval(()=>setMe(Object.assign({},pos||{})),2500);
  draw(true);update();setInterval(update,1000);
  if(geoErr)toast(geoErr,5000);
}

function panelMode(){

  app.innerHTML=`<div class="panel">
  <div class="row"><div class="brand"><img class="logo" src="${ICON}" alt="">Panel</div><div class="tools">${connPill()}<button class="iconbtn" id="sw" aria-label="Rol değiştir">${IC.menu}</button></div></div>
  <div class="stats" id="stats"></div>
  <div class="pgrid">
    <div style="display:grid;gap:10px;min-width:0">
      <div class="tools"><button class="btn sm" id="zS" style="background:#E08A00;color:#fff">+ Yavaş bölge</button><button class="btn sm" id="zB" style="background:#E5484D;color:#fff">+ Yasak bölge</button><label class="field" style="display:flex;align-items:center;gap:6px">Yarıçap<input type="number" id="zr" value="120" min="20" max="2000" step="10" style="width:86px;padding:8px">m</label><button class="btn ghost sm" id="fit">Hepsini göster</button></div>

      <div class="card"><h2>Fiyat</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="field">Açılış (₺)<input type="number" id="pO" step="0.5" min="0" value="${price.open}"></label><label class="field">Dakika (₺)<input type="number" id="pM" step="0.5" min="0" value="${price.min}"></label></div><button class="btn" id="pS">Fiyatı kaydet</button></div>
      <div class="card" id="shareCard"></div>
    </div>
  </div></div>`;
  $("#sw").onclick=switchRole;
  function shareCard(edit){
    const url=publicUrl(),c=$("#shareCard");
    if(!url||edit){
      c.innerHTML=`<h2>Herkese açık link</h2><p class="note">Test edecek kişilere gidecek linki bir kez buraya yapıştır (GitHub linkin). Uygulama bunu hatırlar.</p><input type="text" id="pubIn" inputmode="url" placeholder="https://kullaniciadin.github.io/kayahan-scooter/" value="${esc(url)}"><button class="btn" id="pubSave">Kaydet</button>`;
      $("#pubSave").onclick=()=>{let v=$("#pubIn").value.trim();if(!/^https:\/\//.test(v)){toast("Link https:// ile başlamalı");return}ls.set("ks_public",v);shareCard(false)};return}
    c.innerHTML=`<div class="row"><h2>Linki paylaş</h2>${IN_APP?'<button class="btn ghost sm" id="pubEdit">Değiştir</button>':""}</div><p class="note">Bu linki açan her telefon sisteme bağlanır. TV'de açmak için sonuna <b class="mono">#tv</b> ekle.</p><div class="qrbox"><div id="jq"></div></div><p class="note mono" style="word-break:break-all">${esc(url)}</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("Kayahan Scooter testine katıl: "+url+"\nLinki aç, rolünü seç (Scooter veya Müşteri), konum ve kamera iznine İzin ver de.")}">WhatsApp'tan gönder</a>`;
    new QRCode($("#jq"),{text:url,width:190,height:190});
    $("#pubEdit")&&($("#pubEdit").onclick=()=>shareCard(true));
  }
  shareCard(false);urlHandlers.add(()=>{if(!$("#pubIn"))shareCard(false)});
  const map=makeMap($("#mapEl")),zl=L.layerGroup().addTo(map),dl=L.layerGroup().addTo(map),trl=L.layerGroup().addTo(map);
  let mode=null,fitted=false;const trails=new Map();
  let rides=[];try{rides=JSON.parse(ls.get("ks_rides")||"[]")}catch(e){}
  rideHandlers.add(r=>{if(rides.some(x=>x.end===r.end&&x.sid===r.sid))return;rides.unshift(r);rides=rides.slice(0,50);ls.set("ks_rides",JSON.stringify(rides));drawLists()});
  function setMode(m){mode=mode===m?null:m;$("#zS").classList.toggle("on",mode==="slow");$("#zB").classList.toggle("on",mode==="ban");$("#zH").hidden=!mode;$("#zH").textContent="Haritada bölgenin merkezine dokun."}
  $("#zS").onclick=()=>setMode("slow");$("#zB").onclick=()=>setMode("ban");
  map.on("click",e=>{if(!mode)return;if(!connected){toast("Canlı bağlantı yok");return}
    zones=zones.concat([{id:"z"+Date.now(),lat:+e.latlng.lat.toFixed(6),lng:+e.latlng.lng.toFixed(6),r:Math.max(20,Math.min(2000,+$("#zr").value||120)),type:mode}]);
    publish("zones",zones,true);toast(mode==="ban"?"Yasak bölge eklendi":"Yavaş bölge eklendi");setMode(mode);update()});
  $("#fit").onclick=()=>fit(true);
  $("#pS").onclick=()=>{const p={open:Math.max(0,+$("#pO").value||0),min:Math.max(0,+$("#pM").value||0)};price=p;publish("price",p,true);toast("Fiyat kaydedildi")};
  function fit(force){const pts=[...devices.values()].filter(d=>online(d)&&d.lat!=null).map(d=>[d.lat,d.lng]);if(pts.length&&(force||!fitted)){map.fitBounds(pts,{padding:[60,60],maxZoom:17});fitted=true}}

  function drawLists(){
    const D=[...devices.values()].filter(d=>d.role!=="panel"&&d.role!=="tv"&&online(d));
    $("#devs").innerHTML=D.length?D.sort((a,b)=>a.role.localeCompare(b.role)||a.id.localeCompare(b.id)).map(d=>{
      const r=d.role==="scooter"?riderOf(d.id):null,z=zoneOf(d.lat,d.lng);
      const chip=d.role==="musteri"?(d.ride?'<span class="chip c-ok">Sürüyor</span>':'<span class="chip c-blue">Müşteri</span>'):r?'<span class="chip c-ok">Sürüşte</span>':'<span class="chip c-warn">Kilitli</span>';
      const sub=d.role==="scooter"?`%${d.bat??"?"}${d.acc!=null?" · GPS ±"+d.acc+" m":" · konum yok"}${r?" · "+esc(r.name||"")+" · "+mmss((Date.now()-r.ride.start)/1000):""}${z&&r?" · "+(z==="ban"?"YASAK bölgede":"yavaş bölgede"):""}`:`${d.ride?"Sürüyor: "+esc(d.ride.sid):"Bekliyor"}${d.acc!=null?" · GPS ±"+d.acc+" m":""}`;
      return `<div class="it2"><div><div class="t mono">${esc(d.role==="musteri"?(d.name||d.id):d.id)}</div><div class="s">${sub}</div></div><div class="tools">${chip}${r?`<button class="btn sm danger" data-lock="${esc(d.id)}">Kilitle</button>`:""}</div></div>`}).join(""):'<p class="note">Henüz bağlı telefon yok. Linki bir telefonda açıp rol seç.</p>';
    $("#rides").innerHTML=rides.length?rides.slice(0,15).map(r=>`<div class="it2"><div><div class="t mono">${esc(r.sid)}</div><div class="s">${esc(r.rider||"")} · ${r.min} dk · ${r.km} km${r.byPanel?" · panel kilitledi":""} · ${new Date(r.end).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</div></div><span class="mono" style="font-weight:800">${tl(r.total)}</span></div>`).join(""):'<p class="note">Panel açıkken biten sürüşler burada listelenir.</p>';
  }
  function update(){
    const S=scooters(),C=customers(),today=new Date().toDateString();
    const st=[["Çevrimiçi scooter",S.length,"var(--accent)"],["Aktif sürüş",S.filter(s=>riderOf(s.id)).length,"var(--ok)"],["Çevrimiçi müşteri",C.length,"var(--blue)"],["Bugünkü ciro",tl(rides.filter(r=>new Date(r.end).toDateString()===today).reduce((a,r)=>a+r.total,0)),"var(--accent-2)"]];
    $("#stats").innerHTML=st.map(([a,b,c])=>`<div class="stat" style="--tint:${c}"><small>${a}</small><b>${b}</b></div>`).join("");
    drawZones(zl,z=>{const box=document.createElement("div");box.innerHTML=`<b>${z.type==="ban"?"Yasak bölge":"Yavaş bölge"}</b><br>${Math.round(z.r)} m yarıçap<br><button style="margin-top:6px">Bölgeyi sil</button>`;box.querySelector("button").onclick=()=>{zones=zones.filter(x=>x.id!==z.id);publish("zones",zones,true);map.closePopup();toast("Bölge silindi");update()};L.popup().setLatLng([z.lat,z.lng]).setContent(box).openOn(map)});
    dl.clearLayers();trl.clearLayers();
    S.forEach(s=>{const r=riderOf(s.id);if(r&&s.lat!=null){const t=trails.get(s.id)||[];const l=t[t.length-1];if(!l||l[0]!==s.lat||l[1]!==s.lng)t.push([s.lat,s.lng]);trails.set(s.id,t.slice(-600))}else trails.delete(s.id)});
    trails.forEach(t=>{if(t.length>1){L.polyline(t,{color:"#fff",weight:8,opacity:.85}).addTo(trl);L.polyline(t,{color:"#14A865",weight:4.5}).addTo(trl)}});
    S.filter(s=>s.lat!=null).forEach(s=>L.marker([s.lat,s.lng],{icon:pinIcon(s)}).bindTooltip(`${s.id} · %${s.bat??"?"}`).addTo(dl));
    C.filter(c=>c.lat!=null).forEach(c=>L.marker([c.lat,c.lng],{icon:custIcon()}).bindTooltip("Müşteri · "+esc(c.name||c.id)).addTo(dl));
    fit(false);drawLists();
  }
  handlers.add(()=>{if(document.activeElement!==$("#pO")&&document.activeElement!==$("#pM")){$("#pO").value=price.open;$("#pM").value=price.min}});
  update();setInterval(update,1500);
}

  $("#sw").onclick=switchRole;
  const qs=Math.round(innerWidth*0.075);if(url)new QRCode($("#tq"),{text:url,width:qs,height:qs});
  const map=makeMap($("#mapEl"),true),zl=L.layerGroup().addTo(map),dl=L.layerGroup().addTo(map),trl=L.layerGroup().addTo(map);
  const trails=new Map();let rides=[];let fitAt=0;
  rideHandlers.add(r=>{if(rides.some(x=>x.end===r.end&&x.sid===r.sid))return;rides.unshift(r);rides=rides.slice(0,12)});
  const clk=()=>$("#clk").textContent=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});clk();setInterval(clk,10000);
  function update(){
    const S=scooters(),C=customers(),act=S.filter(s=>riderOf(s.id));
    $("#ts").innerHTML=[["Scooter",S.length],["Sürüşte",act.length],["Müşteri",C.length],["Ciro",tl(rides.reduce((a,r)=>a+r.total,0)).replace(",00","")]].map(([a,b])=>`<div class="tstat"><small>${a}</small><b>${b}</b></div>`).join("");
    $("#tr").innerHTML=act.length?act.map(s=>{const r=riderOf(s.id),sec=(Date.now()-r.ride.start)/1000,z=zoneOf(s.lat,s.lng);return `<div class="trow"><div><b>${esc(s.id)}</b><small>${esc(r.name||"Müşteri")} · %${s.bat??"?"}${z?" · "+(z==="ban"?"YASAK BÖLGE":"yavaş bölge"):""}</small></div><div style="text-align:right"><b>${mmss(sec)}</b><small>${tl(price.open+Math.max(1,Math.ceil(sec/60))*price.min)}</small></div></div>`}).join(""):'<p style="color:#93A1B4;margin:0">Şu an aktif sürüş yok.</p>';
    $("#tl").innerHTML=rides.length?rides.slice(0,4).map(r=>`<div class="trow"><div><b>${esc(r.sid)}</b><small>${esc(r.rider||"")} · ${r.min} dk · ${r.km} km</small></div><b>${tl(r.total)}</b></div>`).join(""):'<p style="color:#93A1B4;margin:0">Henüz biten sürüş yok.</p>';
    drawZones(zl);dl.clearLayers();trl.clearLayers();
    S.forEach(s=>{const r=riderOf(s.id);if(r&&s.lat!=null){const t=trails.get(s.id)||[];const l=t[t.length-1];if(!l||l[0]!==s.lat||l[1]!==s.lng)t.push([s.lat,s.lng]);trails.set(s.id,t.slice(-800))}else trails.delete(s.id)});
    trails.forEach(t=>{if(t.length>1){L.polyline(t,{color:"#FF8A00",weight:10,opacity:.25}).addTo(trl);L.polyline(t,{color:"#FFB000",weight:4}).addTo(trl)}});
    S.filter(s=>s.lat!=null).forEach(s=>L.marker([s.lat,s.lng],{icon:pinIcon(s)}).addTo(dl));
    C.filter(c=>c.lat!=null).forEach(c=>L.marker([c.lat,c.lng],{icon:custIcon()}).addTo(dl));
    const pts=[...S,...C].filter(d=>d.lat!=null).map(d=>[d.lat,d.lng]);
    if(pts.length&&Date.now()-fitAt>15000){map.flyToBounds(pts,{padding:[80,80],maxZoom:17,duration:1.2});fitAt=Date.now()}
  }
  update();setInterval(update,1500);keepAwake();
}

function start(){
  if(!window.L||!window.mqtt){app.innerHTML=`<div class="welcome"><div class="brand"><img class="logo" src="${ICON}" alt="">Kayahan Scooter</div><h1>İnternet bağlantısı gerekli</h1><p class="note">Sayfanın parçaları yüklenemedi. Bağlantını kontrol edip sayfayı yenile.</p></div>`;return}
  if(role==="scooter")scooterMode();else if(role==="musteri")customerMode();else if(role==="panel")panelMode();else if(role==="tv")tvMode();else chooseScreen();
}
start();
</script>
</body>
</html>
